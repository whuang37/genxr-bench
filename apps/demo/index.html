<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GenXR-Bench · XR Blocks demo</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status { position: absolute; z-index: 1000; inset: 0; display: grid; place-content: center; background: #f5f7f5; color: #264235; text-align: center; padding: 30px; font-size: 15px; }
    #status[hidden] { display: none; }
  </style>
  <!-- The same browser import-map approach used by genxr-viewer. Versions are pinned. -->
  <script type="importmap">
    {"imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
      "troika-three-text": "https://cdn.jsdelivr.net/gh/protectwise/troika@028b81cf308f0f22e5aa8e78196be56ec1997af5/packages/troika-three-text/src/index.js",
      "troika-three-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-three-utils/src/index.js",
      "troika-worker-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-worker-utils/src/index.js",
      "bidi-js": "https://esm.sh/bidi-js@%5E1.0.2?target=es2022",
      "webgl-sdf-generator": "https://esm.sh/webgl-sdf-generator@1.1.1/es2022/webgl-sdf-generator.mjs",
      "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.0/build/xrblocks.js",
      "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.21.0/build/addons/",
      "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
      "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
      "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
      "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
      "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
      "lit": "https://esm.sh/lit@3.3.1",
      "lit/": "https://esm.sh/lit@3.3.1/",
      "three-pathfinding": "https://cdn.jsdelivr.net/npm/three-pathfinding@1.3.0/dist/three-pathfinding.module.js",
      "@dimforge/rapier3d-simd-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-simd-compat@0.19.2/rapier.mjs"
    }}
  </script>

  <style id="genxr-scrollbar-suppression">
    * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
    }
  </style>
</head>
<body>
  <div id="status" role="status">Loading XR Blocks…</div>
  <script type="module">
    const status = document.querySelector('#status');
    const timer = setTimeout(() => { status.textContent = 'Still loading XR Blocks. Check your connection, or use Reset app to retry.'; }, 20000);
    import('./main.js').then(async ({ start }) => {
      await start();
      clearTimeout(timer);
      status.hidden = true;
    }).catch(error => {
      clearTimeout(timer);
      status.hidden = false;
      status.textContent = 'The demo could not load. Check your connection and WebGL support, then use Reset app to retry.';
      console.error(error);
    });
  </script>
</body>
</html>
