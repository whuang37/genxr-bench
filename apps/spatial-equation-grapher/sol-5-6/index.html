  <script type="module">
    import * as xb from 'xrblocks';

    if (xb.SimulatorControls) {
      const origControlsInit = xb.SimulatorControls.prototype.init;
      xb.SimulatorControls.prototype.init = function(args) {
        if (args && args.simulatorOptions) {
          args.simulatorOptions.defaultMode = xb.SimulatorMode.POSE;
        }
        const res = origControlsInit.apply(this, arguments);
        this.setSimulatorMode(xb.SimulatorMode.POSE);
        return res;
      };
    }

    // 1. Resolve DOMContentLoaded race condition:
    // If document is already loaded when main.js registers its listener, trigger it promptly.
    const _origAddEventListener = document.addEventListener.bind(document);
    document.addEventListener = function(type, listener, options) {
      if (type === 'DOMContentLoaded' && (document.readyState === 'interactive' || document.readyState === 'complete')) {
        setTimeout(listener, 0);
        return;
      }
      return _origAddEventListener(type, listener, options);
    };

    // 2. Patch xb.Options.prototype.parseUrlParams to force desktop simulator with all controls enabled:
    const origParse = xb.Options.prototype.parseUrlParams;
    xb.Options.prototype.parseUrlParams = function() {
      if (origParse) origParse.call(this);
      this.formFactor = 'desktop';
      this.enableSimulator = true;
      if (!this.xrButton) this.xrButton = {};
      this.xrButton.alwaysAutostartSimulator = true;
      this.xrButton.showEnterSimulatorButton = true;

      if (!this.simulator) this.simulator = {};
      this.simulator.simulatorSettingsPanel = this.simulator.simulatorSettingsPanel || {};
      this.simulator.simulatorSettingsPanel.enabled = true;
      this.simulator.handPosePanel = this.simulator.handPosePanel || {};
      this.simulator.handPosePanel.enabled = true;
      this.simulator.instructions = this.simulator.instructions || {};
      this.simulator.instructions.enabled = true;
      this.simulator.instructions.showAutomatically = false;
      this.simulator.modeToggle = this.simulator.modeToggle || {};
      this.simulator.modeToggle.enabled = true;
      this.simulator.defaultMode = xb.SimulatorMode.POSE;
    };

    // 3. Monitor initialization to dismiss loading splash
    const checkInit = setInterval(() => {
      const canvas = document.querySelector('canvas');
      const xrWrapper = document.getElementById('XRButtonWrapper');
      if (canvas || xrWrapper) {
        const status = document.getElementById('status');
        if (status) status.hidden = true;
        clearInterval(checkInit);
      }
    }, 200);
  </script>
