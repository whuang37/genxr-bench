<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#040814" />
    <title>Hand Fire</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #040814;
        color: #f8fbff;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, rgba(35, 55, 91, .32), transparent 38%),
          linear-gradient(180deg, #071020 0%, #030611 100%);
      }

      canvas { display: block; }

      .hud {
        position: fixed;
        inset: 0;
        z-index: 4;
        padding: clamp(20px, 4vw, 48px);
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        width: fit-content;
        padding: 8px 13px 8px 9px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 999px;
        background: rgba(5, 10, 24, .46);
        box-shadow: inset 0 1px rgba(255,255,255,.05);
        backdrop-filter: blur(14px);
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 15px;
        background: conic-gradient(from 220deg, #249cff, #75dcff, #ffbd4a, #ff6b22, #249cff);
        box-shadow: 0 0 22px rgba(75, 173, 255, .25);
      }

      h1 {
        margin: 0;
        font-size: 13px;
        letter-spacing: .17em;
        line-height: 1;
        text-transform: uppercase;
        font-weight: 720;
      }

      .guide {
        align-self: center;
        width: min(620px, calc(100vw - 32px));
        padding: 12px 16px 14px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(12,20,38,.74), rgba(5,10,23,.8));
        box-shadow: 0 18px 60px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.06);
        backdrop-filter: blur(16px);
        text-align: center;
      }

      .status {
        margin: 0 0 10px;
        color: #fff;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: .02em;
      }

      .steps {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #9eacc5;
        font-size: 11px;
        letter-spacing: .035em;
      }

      .step { white-space: nowrap; }
      .step strong { color: #dce7f8; font-weight: 650; }
      .dot { color: #53637d; }
      .blue { color: #5cc8ff; }
      .orange { color: #ffac52; }

      .progress {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: min(620px, calc(100vw - 32px));
        height: 2px;
        border-radius: 999px;
        overflow: hidden;
        transform: translateX(-50%);
        background: rgba(255,255,255,.05);
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        opacity: 0;
        transition: width 90ms linear, opacity 180ms ease;
        background: linear-gradient(90deg, #45baff, #f9f4d3, #ff9138);
        box-shadow: 0 0 12px #fff;
      }

      @media (max-width: 520px) {
        .hud { padding: 16px; }
        .steps { gap: 6px; font-size: 10px; }
        .dot { display: none; }
        .steps { flex-direction: column; }
      }
    </style>
    <script type="importmap">
    {"imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.184.0/",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
      "troika-three-text": "https://cdn.jsdelivr.net/gh/protectwise/troika@028b81cf308f0f22e5aa8e78196be56ec1997af5/packages/troika-three-text/src/index.js",
      "troika-three-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-three-utils/src/index.js",
      "troika-worker-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-worker-utils/src/index.js",
      "bidi-js": "https://esm.sh/bidi-js@%5E1.0.2?target=es2022",
      "webgl-sdf-generator": "https://esm.sh/webgl-sdf-generator@1.1.1/es2022/webgl-sdf-generator.mjs",

      "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",

      "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",

  <script type="module">
    import * as THREE from 'three';
    import * as xb from 'xrblocks';

    if (xb.SimulatorControls) {
      const origControlsInit = xb.SimulatorControls.prototype.init;
      xb.SimulatorControls.prototype.init = function(args) {
        if (args && args.simulatorOptions) {
          args.simulatorOptions.defaultMode = xb.SimulatorMode.POSE;
        }
        const res = origControlsInit.apply(this, arguments);
        this.setSimulatorMode(xb.SimulatorMode.POSE);
        return res;
      };
    }

    // Fix THREE.Sprite raycast: sprites attached to hands/particles should not intercept interaction rays
    THREE.Sprite.prototype.raycast = function() {};

    const _origAddEventListener = document.addEventListener.bind(document);
    document.addEventListener = function(type, listener, options) {
      if (type === 'DOMContentLoaded' && (document.readyState === 'interactive' || document.readyState === 'complete')) {
        setTimeout(listener, 0);
        return;
      }
      return _origAddEventListener(type, listener, options);
    };

    const origParse = xb.Options.prototype.parseUrlParams;
    xb.Options.prototype.parseUrlParams = function() {
      if (origParse) origParse.call(this);
      this.formFactor = 'auto';
      this.enableSimulator = true;
      if (!this.xrButton) this.xrButton = {};
      this.xrButton.alwaysAutostartSimulator = true;
      this.xrButton.showEnterSimulatorButton = true;

      if (!this.simulator) this.simulator = {};
      this.simulator.simulatorSettingsPanel = this.simulator.simulatorSettingsPanel || {};
      this.simulator.simulatorSettingsPanel.enabled = true;
      this.simulator.handPosePanel = this.simulator.handPosePanel || {};
      this.simulator.handPosePanel.enabled = true;
      this.simulator.instructions = this.simulator.instructions || {};
      this.simulator.instructions.enabled = true;
      this.simulator.instructions.showAutomatically = false;
      this.simulator.modeToggle = this.simulator.modeToggle || {};
      this.simulator.modeToggle.enabled = true;
      this.simulator.defaultMode = xb.SimulatorMode.POSE;
      if (!this.hands) this.hands = {};
      this.hands.visualizeJoints = false;
    };

    const checkInit = setInterval(() => {
      const canvas = document.querySelector('canvas');
      const xrWrapper = document.getElementById('XRButtonWrapper');
      if (canvas || xrWrapper) {
        const status = document.getElementById('status');
        if (status) status.hidden = true;
        clearInterval(checkInit);
      }
    }, 200);
  </script>

  <style id="genxr-scrollbar-suppression">
    * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
    }
  </style>
</head>
  <body>
    <main class="hud" aria-label="Hand Fire controls">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <h1>Hand Fire</h1>
      </header>
      <section class="guide">
        <p id="status" class="status" aria-live="polite">Raise both hands to awaken the flames</p>
        <div class="steps" aria-label="How to play">
          <span class="step"><strong>1</strong>&nbsp; Raise palms</span>
          <span class="dot">·</span>
          <span class="step"><strong>2</strong>&nbsp; <span class="blue">Pinch</span> both hands</span>
          <span class="dot">·</span>
          <span class="step"><strong>3</strong>&nbsp; Join streams for 1 second</span>
        </div>
        <div class="progress" aria-hidden="true"><div id="merge-progress" class="progress-fill"></div></div>
      </section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
